# Standby — Umbrel app manifest
# Lives in its own community store (thefuckisalommy/Standby),
# App id `standby`, port 3100.
manifestVersion: 1
id: standby
category: automation
name: Standby
version: "0.8.20"
releaseNotes: |-
  0.8.20 — Standalone downloads. Standby now also comes as a single program for Windows (x64) and Linux (x64 and arm64) with nothing else to install: no Docker and no Node. Double-click it (or run ./standby): a window shows it is running and the page opens in your browser at http://localhost:3100; closing the window stops it. Your data is kept in your own user folder (%APPDATA%\Standby on Windows, ~/.local/share/standby on Linux), and "Forgot password?" names that folder. Each release has SHA-256 checksums and GitHub build attestations; the Windows build is not code-signed yet. Check-ins from other devices: on the download and a plain Node run, switch on "Accept check-ins from other devices" in Settings > Check-in API keys and Standby opens port 3101 for check-ins only (each needs an API key; nothing else in Standby can be reached through it). Docker and Umbrel keep the separate check-in receiver. Behind the scenes: the app can be bundled into one script (tools/bundle.js), and the test suites also run against that bundle.

  0.8.19 — First-open setup and app password. A fresh install opens a short setup, one page per step: an app password (skippable, with a warning), the Bitcoin nodes and price sources (keep the defaults or choose your own), how each trigger works, and your first transaction (or skip). Without STANDBY_PASSWORD, a password can now be set, changed or removed in the app (Settings → App login); it is stored only as a hash, and a forgotten one is reset on the machine itself (start with --reset-password), never over the network. The login screen has "Forgot password?" instructions. Settings has Start fresh (delete all data and a password set in the app, with a typed confirmation and the password; setup then runs again) and Run setup again. Existing installs are not shown the setup.

  0.8.18 — Maintenance release with no change to how the app works: a one-command version bump for releases (tools/bump-version.js), the tests read the version from package.json, code lint runs in CI, and these release notes keep only the latest few releases (the full history is in CHANGELOG.md).

  0.8.17 — Windows groundwork. Standby now runs on Windows under plain Node (no Docker), and every test suite runs on Windows in CI alongside Linux. Saving no longer depends on Linux-only steps: a file Windows briefly holds open (an antivirus scan, the check-in receiver reading it) is retried, and Windows' own folder permissions protect the data instead of Linux file modes. Ctrl+Break stops it cleanly on Windows, saving its last-online time. A run without Docker now keeps the check-in folder inside the data folder (data/checkin) instead of /checkin; Docker and Umbrel installs are unchanged. Also: only one copy of Standby can run on a data folder (a second copy refuses to start, and a copy that finds another has taken over stops before it evaluates or broadcasts, so two can never both broadcast); a port already in use is a clear message instead of a crash; and STANDBY_LOG_FILE also writes the log to a file. Clock check: a due set-date or check-in trigger now fires only once a node confirms this device's clock is within 10 minutes of its own time; while the clock is off, or no node has answered to check it, the trigger is held with the reason on the card. A wrong clock (a desktop just woken, a dead clock battery) can no longer fire one early. Grace: only being offline longer than the grace threshold (7 days by default) starts a grace, the same rule for every trigger type; a short check-in period no longer starts a week-long grace after a few hours offline.

  Older releases: https://github.com/thefuckisalommy/Standby/blob/main/CHANGELOG.md
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, watching a price, or keeping a transaction ready for a UTXO to move, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Each transaction carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire when the price crosses a value you set), UTXO moved (fire when a named outpoint is spent), Block height (fire when the chain reaches a height), Set date (fire at a date and time), Fee market (fire when the economy fee crosses a rate you set, up or down), or Manual only (never fires on its own).

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
