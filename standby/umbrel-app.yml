version: "0.8.7.2"
releaseNotes: |-
  0.8.7.2 — The confirmation count on an old broadcast no longer freezes: once a transaction is 6 confirmations deep, the card derives the count from its confirming block height plus the current tip instead of repeating the last stored snapshot — so a transaction broadcast days ago keeps counting up with no extra requests to the node. Below 6 confirmations nothing changes: the node is still asked every hour until the transaction is 6 deep, because a single sighting is not trusted.

  0.8.7.1 — A broadcast the network no longer knows is now called what it is: if the transaction's input was spent by another confirmed transaction, the card reads stale — in red — instead of "may have been dropped from the mempool" in green. The broadcast line's colour follows the verdict now (confirmed green, unconfirmed amber, not found or stale red). Also, the 390px width check in the test suite tolerates sub-pixel rounding between Chromium builds instead of failing on it.

  0.8.7 — Shared trigger sets: one set of triggers can now drive several transactions. Define the triggers once, attach the transactions, and when the set fires every attached transaction broadcasts. One label and one arm/disarm per set; the set's triggers are evaluated once per tick for all its members, not once per transaction. A member whose inputs are spent is skipped — it carries a 'stale' pill on its subcard — and the set keeps firing for its non-stale members; only when every member is stale does the whole set move to archive. Deleting a set returns its transactions to standalone; the transactions themselves are never deleted with it.

  0.8.6 — UTXO triggers share their work now: repeated checks of the same outpoint cost one request per check cadence, and when several watched outputs belong to one funding transaction they are answered with a single request instead of one per output. A confirmed-spend UTXO rule also reuses the shared per-tick block-height fetch instead of fetching the tip itself. An outpoint no node can say about is still unknown, never unspent. Fold-in: a batch lookup whose watched outputs are already cached costs no request at all, and two overlapping checks of the same outpoint — or the same funding transaction's batch — share one in-flight request instead of issuing two. A failed request never poisons the cache: the next lookup fetches fresh. The check-interval help now warns that a very fast cadence can get this IP rate-limited by a public node.

  0.8.5 — Live view: pills, prices, fees and block height update on their own now — the page refreshes at the check cadence, and the check-in countdown ticks every second without a fetch. Typing and popups are never interrupted: values update in place, and a new or moved transaction waits until no popup is open. Each node and exchange row carries its own last-checked time. Archived transactions no longer cause any network activity — a broadcast transaction is only re-checked until it reaches 6 confirmations — and the block-height tip is fetched once per tick from the primary node, so the node traffic no longer grows with the number of transactions. The fee trigger now fetches the market fee once per 5 minutes, shared across all fee transactions.

  0.8.4 — Fee rule pill stays live — reads the last known fee like price does. Trigger statuses stay live for disarmed transactions — evaluated for display, never broadcast unless armed. Block-height trigger no longer latches — judged fresh each tick like every other rule.

  0.8.3 — Persistence hardening: rotating state backups, recovery from a corrupt state file, and check-in key verification on startup.

  - **Rotating state backups:** every save keeps the previous version as state.json.bak, the first save of each day snapshots the state (kept 7 days), and a snapshot is taken before any migration changes the state shape. A slow wipe — like the check-in keys that vanished in November — stays recoverable from yesterday's snapshot even though every save since is keyless.
  - **Corrupt-state recovery:** a state file that cannot be read no longer crashes the app on startup — it recovers from the newest usable backup, preserves the corrupt file for inspection, and says so in the log. If no backup loads, it fails loudly instead of silently resetting to an empty state.
  - **Check-in key verification on startup:** the app now compares its check-in keys with the receiver's key list when it starts, rewrites the receiver's list when state has keys the receiver is missing, and warns (without overwriting anything) when state has no keys but the receiver — or a backup — still does.

  0.8.2 — Multiple triggers per transaction.

  - **Rule sets:** each transaction can now carry several triggers at once, combined with AND or OR. OR fires when any rule fires; AND fires only when every rule holds at the same moment. The Add and Edit forms let you add, remove, and reorder rules, and pick AND or OR for the set.

  0.8.1 — Three more triggers join the broadcast engine.

  - **Block height:** fire when the chain reaches a block height you set. Deterministic — the height comes from your node's own chain.
  - **Set date:** fire at a date and time you set, whether or not you check in. A pure deadline — checking in does not snooze it.
  - **Fee market:** fire when the economy fee crosses a rate you set (sat/vB) — falls to or below it, or rises to or above it.
  - **Custom price source:** pick Custom for either price source and point Standby at your own endpoint — a URL plus the JSON path to the price (for example, `data.amount`).

  Block-height, set-date, and fee-market rules are evaluated about once a minute, alongside price and UTXO rules; check-in rules stay hourly. A rule whose condition is already met when you add or edit it is blocked unless you confirm it — so a height already reached, a date already passed, or a fee already past your threshold does not fire the moment you save it. The grace period and vacation freeze still apply only to price and UTXO triggers (grace) and check-in triggers (vacation) — the new triggers are not held by either.

  Also in 0.8.1:

  - **Node capability test:** Test connection now reports each node's Broadcast, Fee estimates, and Block height readiness, with the measured value beside it — and each node is one row, with the checks in a drop-down.
  - **Per-transaction history:** each transaction card now has a History section, nested inside Details — a timeline of what happened to it, oldest first: added, trigger fired, broadcast sent, confirmed, went stale, edits, and arm/disarm changes. Older transactions get their history filled in from what Standby already knows (a broadcast that confirmed shows added, broadcast, confirmed).
  - **Primary first:** prices, fees, and block height all come from the primary source or node; the secondary is only a fallback if the primary is down.
  - **Readiness card:** transactions read as separate tiles, node and exchange status sit in their own sub-card, and the price sits next to each source's status.
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, watching a price, or keeping a transaction ready for a UTXO to move, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Each transaction carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire when the price crosses a value you set), UTXO moved (fire when a named outpoint is spent), Block height (fire when the chain reaches a height), Set date (fire at a date and time), Fee market (fire when the economy fee crosses a rate you set, up or down), or Manual only (never fires on its own).

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
