# Standby — Umbrel app manifest. One package for both stores: this
# repository's community store installs it from this folder, and the
# official Umbrel App Store submission is a copy of the same folder (see
# umbrel-official/README.md). Fields in the official store's order.
manifestVersion: 1
id: standby
storage:
  dataRoot: data
category: bitcoin
name: Standby
version: "0.8.24"
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, watching a price, or keeping a transaction ready for a UTXO to move, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Each transaction carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire when the price crosses a value you set), UTXO moved (fire when a named outpoint is spent), Block height (fire when the chain reaches a height), Set date (fire at a date and time), Fee market (fire when the economy fee crosses a rate you set, up or down), or Manual only (never fires on its own).

  Before you start

  - Standby keeps fully signed transactions. Anyone who gets a copy of its data, including an Umbrel backup, can broadcast them: protect this device and its backups.
  - Triggers are only checked while Standby is running.
  - A broadcast transaction still has to confirm. If fees rise well above the fee it was signed with, it can wait a long time.

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
releaseNotes: |-
  0.8.24 — A new look, starting with the Dashboard. Darker and calmer: near-black panels, thinner lines, one orange accent for the main action and for what is armed, and colour only where it means something (green OK, amber watch, red risk). The tabs sit in the top bar on a computer and along the bottom of the screen on a phone. Dashboard: the Check-in card has the button beside your last check-in, and each check-in transaction shows its days left and due day, with the last quarter of its window hatched; a new Connections card shows both nodes and both price sources; Active transactions show an orange edge while armed and turn grey when disarmed, with each trigger in its own colour. The top bar replaces the menu with three buttons: Alerts (a bell with a count: a check-in deadline close or due, a node or price source failing, a transaction that cannot go out cleanly, broadcasts waiting to confirm, a new version), Lock (logs this browser out after a confirm, shown when a password is set) and, on Umbrel, a button back to the Umbrel home. Transactions is now a list and a detail: on the left, search, Add, an Active / Pending / Archived switch and one compact row per transaction or set (name, amount, its triggers as coloured chips, how close it is to firing, fee risk when medium or high, a set's transactions; armed rows have the orange edge, disarmed ones are greyed out under Disarmed); on the right, the selected one in full, with Armed, Sends, Fee and Route at the top and its actions beside the name. On a phone the list comes first and a row opens its own screen, with a link back. Settings and Logs are narrower and quieter: Save buttons are plain, and log tables have small headers and monospace txids.

  0.8.23 — Umbrel: one package for both app stores. On Umbrel, Standby now opens at port 3102 instead of 3100 (3100 is taken in the official Umbrel App Store); your data and check-ins are kept, and check-ins still use port 3101. Its category is now Bitcoin, and the store description says up front that anyone holding the signed transactions, including from a backup, can broadcast them, that triggers only run while Standby runs, and that a broadcast still has to confirm. Behind the scenes: the Umbrel package follows the official store's rules (data folders included instead of a start-up script, images pinned to their exact build, pinned automatically after each release), so the same folder is used for this store and an official submission. SECURITY.md notes that every copy of the data folder holds the signed transactions. Nothing else changes in the app.

  0.8.22 — Maintenance only: nothing changes in how Standby looks or works. The page's script, one file of almost 6,000 lines, is now split by area into eight files in standby/public/js/ (core, dashboard, transactions, sets, live, settings, setup, main), loaded in order and sharing one scope, so each part is easier to find and change. The server's Bitcoin code (lib/bitcoin.js, about 2,400 lines) is split the same way into lib/bitcoin/: transactions, nodes, fees, prices, broadcasting, input checks, dry runs and the node Test. New checks make sure the page files never declare the same name twice or leave one unused, and that the page's copies of a few server rules (the fee verdict, reading a transaction's triggers, its name in history, the check-in danger zone) agree with the server on thousands of inputs. Unused styles were removed, and one oddly indented block was tidied.

  0.8.21 — Desktop: start with the computer, a tray icon, and an update check. The Windows and Linux downloads now start by themselves when you sign in, so triggers keep being checked after a restart (on by default; setup shows it with a switch to turn it off, and so does Settings > This computer, which also has Stop Standby). On Windows, Standby no longer opens a console window: it runs in the background with an icon next to the clock (Open Standby, Quit Standby), and its log goes to standby.log in the data folder. Starting it again while it runs just opens the page. Check for new versions: once a day Standby asks GitHub whether a newer release exists and, if so, says so with a download link (on by default for the downloads, off for Docker and plain Node, not on Umbrel, which updates apps itself; nothing is sent but the request, and nothing is installed automatically). Settings no longer has "Run setup again"; Start fresh still runs setup. The Windows program now shows Standby's own icon and name (in File Explorer, the taskbar, the tray and Task Manager) instead of Node's, and the README says how to remove Standby cleanly.

  Older releases: https://github.com/thefuckisalommy/Standby/blob/main/CHANGELOG.md
