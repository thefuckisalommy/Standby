name: Standby
version: "0.8.1"
releaseNotes: |-
  0.8.1 — Three more triggers join the broadcast engine.

  - **Block height:** fire when the chain reaches a block height you set. Deterministic — the height comes from your node's own chain, and a reorg can't un-fire it.
  - **Set date:** fire at a date and time you set, whether or not you check in. A pure deadline — checking in does not snooze it.
  - **Fee market:** fire when the economy fee crosses a rate you set (sat/vB) — falls to or below it, or rises to or above it.
  - **Custom price source:** pick Custom for either price source and point Standby at your own endpoint — a URL plus the JSON path to the price (for example, `data.amount`).

  Block-height, set-date, and fee-market rules are evaluated about once a minute, alongside price and UTXO rules; check-in rules stay hourly. A rule whose condition is already met when you add or edit it is blocked unless you confirm it — so a height already reached, a date already passed, or a fee already past your threshold does not fire the moment you save it. The grace period and vacation freeze still apply only to price and UTXO triggers (grace) and check-in triggers (vacation) — the new triggers are not held by either.

  Also in 0.8.1:

  - **Node capability test:** Test connection now reports each node's Broadcast, Fee estimates, and Block height readiness, with the measured value beside it — and each node is one row, with the checks in a drop-down.
  - **Primary first:** prices, fees, and block height all come from the primary source or node; the secondary is only a fallback if the primary is down.
  - **Readiness card:** transactions read as separate tiles, node and exchange status sit in their own sub-card, and the price sits next to each source's status.
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, watching a price, or keeping a transaction ready for a UTXO to move, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Each transaction carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire when the price crosses a value you set), UTXO moved (fire when a named outpoint is spent), Block height (fire when the chain reaches a height), Set date (fire at a date and time), Fee market (fire when the economy fee crosses a rate you set, up or down), or Manual only (never fires on its own).

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
