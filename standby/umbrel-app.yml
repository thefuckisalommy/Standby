name: Standby
version: "0.8.0"
releaseNotes: "0.8.0: each transaction now carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire as soon as the price is at or above, or at or below, a dollar value — both feeds must agree, so a single bad feed never fires), UTXO moved (fire when a named outpoint is spent — a confirmed spend only, an unconfirmed mempool spend only watches), and Manual only (never fires on its own). Transactions without a trigger keep working exactly as before: they default to the check-in trigger at the 35-day threshold. The check-in card and its danger-zone guards now belong to the check-in trigger only — a price or UTXO fire never resets the check-in clock, and a check-in never clears a price or UTXO rule. The Release readiness card lists one row per armed rule with a trigger-mode pill and the rule's current state; each transaction card shows its rule in a Trigger box under the amount. Check-in rules are evaluated hourly; price and UTXO rules are evaluated every minute, so a rule whose condition is met fires within a minute. Price comes from two feeds you pick in Settings (CoinGecko and Coinbase by default, no key needed); a reading only counts when the two agree within 5% — if they disagree, or a feed fails, the rule waits — it never fires on data it does not have."
tagline: Presigned Bitcoin transactions, ready when they're needed.
description: |-
  Standby helps you prepare Bitcoin transactions in advance and keep them ready for whenever the time comes to use them.

  Whether you're planning for the unexpected, creating a Bitcoin inheritance plan, watching a price, or keeping a transaction ready for a UTXO to move, Standby gives you a way to prepare today without needing to act today.

  How it works

  - Prepare: Store presigned Bitcoin transactions for future use.
  - Broadcast manually: Send a prepared transaction whenever you decide it's time.
  - Automate: Each transaction carries its own trigger — the rule that fires it. Check-in (fire after N days of silence), BTC price (fire when the price crosses a value you set), UTXO moved (fire when a named outpoint is spent), or Manual only (never fires on its own).

  Why Standby?

  Bitcoin gives you control over your money. Standby helps you plan for situations where you might not be available to exercise that control yourself.

  Prepare in advance. Stay in control. Be ready for the unexpected.

  Standby. Ready when you need it.
