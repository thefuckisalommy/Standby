# Standby test suites.
#
# Runs the 099 generation under test/:
#   - API suite:        python3 test/verify099.py            (~5 min)
#   - Regression suite: python3 test/verify099-regress.py    (~5 min)
#   - DOM suite:        python3 test/dom_launcher099.py      (~4 min, TZ set)
#     (boots the app + stubs, runs dom_check099.js, the 390px
#     width check, and the error-screen script dom_check099_error.js)
#   Each of the three runs twice, in a matrix: the default profile
#   (code defaults, loopback bind) and STANDBY_TEST_PROFILE=umbrel
#   (STANDBY_BIND=0.0.0.0 and STANDBY_ALLOWED_HOSTS, as on Umbrel).
#   Matrix jobs run on separate runners, so the hardcoded ports
#   never collide.
#   - Image job:        bash test/smoke_compose.sh            (~3 min)
#     (builds the image and runs both install paths for real — see
#     the script — after shellcheck on the shell scripts)
#
# Runner needs:
#   - ubuntu-latest, Node 24 (the version the image ships and
#     package.json's engines field requires), Python 3.11+
#   - playwright + chromium: `npm install --prefix test playwright`
#     installs the driver into test/node_modules (no package.json is
#     committed); `npx playwright install chromium` fetches the
#     browser into Playwright's default cache. The launcher only
#     sets PLAYWRIGHT_BROWSERS_PATH when the variable is already
#     set or a local screenshots/browsers copy exists, so CI just
#     leaves it unset.
#   - No network access to the real world is needed at run time:
#     the suites point the app at local stub servers (node
#     test/stubs.js) for Bitcoin nodes, price feeds, fee rates and
#     Slipstream. The runner still needs network for npm/pip
#     installs and the Playwright browser download.
#   - Timeouts: the suites take ~4-6 minutes each; the job gives
#     each 15 minutes so a slow runner does not flake the run.
#   - Ports: API 3438/3439 + stubs 18235/18236, regression
#     3448/3449 + stubs 18245/18246, DOM shares the API ports plus
#     an error phase on 3468/3469 + stubs 18265/18266. API and
#     regression run in parallel (distinct ports); DOM runs after
#     API because it shares its ports.
#
# What it does NOT do: build or push the Docker image. (0.8.11.1)
# The image workflow (.github/workflows/build-standby-image.yml)
# calls this one first (workflow_call) and builds only if it
# passes — so a push to main that changes standby/** is tested
# there, and the push trigger here covers test-only changes.
name: test

on:
  push:
    branches: [main]
    paths:
      - 'test/**'
  pull_request:
    paths:
      - 'standby/**'
      - 'test/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run API suite
        run: python3 test/verify099.py

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run regression suite
        run: python3 test/verify099-regress.py

  dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
      # A fixed UTC-5 offset (no DST, no place name): the DOM suite's
      # expected date strings are written for it.
      TZ: Etc/GMT+5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Playwright driver (test/node_modules, no package.json committed)
        run: npm install --prefix test --no-save playwright
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Run DOM suite (DOM checks + width check + error-screen script)
        run: python3 test/dom_launcher099.py

  # The real image and both install paths, end to end — see
  # test/smoke_compose.sh. Also lints the shell scripts.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint shell scripts (shellcheck is preinstalled on ubuntu-latest)
        run: shellcheck standby/hooks/pre-start test/smoke_compose.sh
      - name: Image + compose smoke test (generic Docker and simulated Umbrel)
        run: bash test/smoke_compose.sh
