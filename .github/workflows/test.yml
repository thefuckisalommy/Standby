# Standby test suites.
#
# Runs the 099 generation under test/:
#   - API suite:        python3 test/verify099.py            (~6 min; CI runs
#     one job per group with --only, about 1-2 min each)
#   - Regression suite: python3 test/verify099-regress.py    (~5 min)
#   - DOM suite:        python3 test/dom_launcher099.py      (~4 min, TZ set)
#     (boots the app + stubs, runs dom_check099.js, the 390px
#     width check, the error-screen script dom_check099_error.js, and
#     the first-open setup check setup_check099.js)
#   Each of the three runs twice, in a matrix: the default profile
#   (code defaults, loopback bind) and STANDBY_TEST_PROFILE=umbrel
#   (STANDBY_BIND=0.0.0.0 and STANDBY_ALLOWED_HOSTS, as on Umbrel).
#   Matrix jobs run on separate runners, so the hardcoded ports
#   never collide.
#   - Image job:        bash test/smoke_compose.sh            (~3 min)
#     (builds the image and runs both install paths for real — see
#     the script — after shellcheck on the shell scripts)
#   - Bundle job:       test/make_bundled_app.sh, then the API and
#     regression suites with STANDBY_TEST_APP_DIR on the bundled copy
#     (~12 min), then test/bundle_nolib_check.sh
#   - Lint job:         npx eslint@9.17.0                     (~30 s)
#     (eslint.config.js at the repo root; nothing is added to the app)
#
# Runner needs:
#   - ubuntu-latest, Node 26 (the version the image ships and
#     package.json's engines field requires), Python 3.11+
#   - playwright + chromium: `npm install --prefix test playwright`
#     installs the driver into test/node_modules (no package.json is
#     committed); `npx playwright install chromium` fetches the
#     browser into Playwright's default cache. The launcher only
#     sets PLAYWRIGHT_BROWSERS_PATH when the variable is already
#     set or a local screenshots/browsers copy exists, so CI just
#     leaves it unset.
#   - No network access to the real world is needed at run time:
#     the suites point the app at local stub servers (node
#     test/stubs.js) for Bitcoin nodes, price feeds, fee rates and
#     Slipstream. The runner still needs network for npm/pip
#     installs and the Playwright browser download.
#   - Timeouts: the suites take ~4-6 minutes each; the job gives
#     each 15 minutes so a slow runner does not flake the run.
#   - Ports: API 3438/3439 + stubs 18235/18236, regression
#     3448/3449 + stubs 18245/18246, DOM shares the API ports plus
#     an error phase on 3468/3469 + stubs 18265/18266 and a setup
#     phase on 3458 + stub 18255. API and
#     regression run in parallel (distinct ports); DOM runs after
#     API because it shares its ports.
#
# What it does NOT do: build or push the Docker image.
# The image workflow (.github/workflows/build-standby-image.yml)
# calls this one first (workflow_call) and builds only if it
# passes — so a push to main that changes standby/** is tested
# there, and the push trigger here covers test-only changes.
name: test

on:
  push:
    branches: [main]
    paths:
      - 'test/**'
  pull_request:
    paths:
      - 'standby/**'
      - 'test/**'
      - 'tools/**'
      - 'eslint.config.js'
      # Workflow-only PRs (e.g. Dependabot's action updates) must be
      # tested too.
      - '.github/workflows/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: ESLint
        run: npx --yes eslint@9.17.0 .
      - name: The page's files share one scope (names declared once, all used)
        run: node test/page_names_check.js

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
        # One job per group (test/api/<group>.py), so they run in parallel.
        group: [triggers, restore, nodes, sets, persistence, fees, security, core]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run API suite (${{ matrix.group }})
        run: python3 test/verify099.py --only ${{ matrix.group }}

  # The single-script bundles (tools/bundle.js) that the standalone builds
  # embed: the API and regression suites run against a copy of the app
  # whose entry scripts are the bundles, then the bundles must start and
  # answer with lib/ deleted (nothing loaded from the app's files).
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: The bundle tool on awkward sources
        run: node test/bundle_check.js
      - name: The Linux sign-in entry on awkward program paths
        run: node test/autostart_check.js
      - name: Build the bundled copy
        run: bash test/make_bundled_app.sh
      - name: API suite against the bundles
        run: STANDBY_TEST_APP_DIR="$PWD/standby-bundled" python3 test/verify099.py
      - name: Regression suite against the bundles
        run: STANDBY_TEST_APP_DIR="$PWD/standby-bundled" python3 test/verify099-regress.py
      - name: The bundles run without lib/
        run: bash test/bundle_nolib_check.sh

  # The same API groups and regression suite on Windows (plain Node, no
  # Docker), so a Windows-only break shows up here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [triggers, restore, nodes, sets, persistence, fees, security, core, regression]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run ${{ matrix.suite }} on Windows
        run: |
          if [ "${{ matrix.suite }}" = regression ]; then
            python test/verify099-regress.py
          else
            python test/verify099.py --only ${{ matrix.suite }}
          fi

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run regression suite
        run: python3 test/verify099-regress.py

  dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [default, umbrel]
    env:
      STANDBY_TEST_PROFILE: ${{ matrix.profile }}
      # A fixed UTC-5 offset (no DST, no place name): the DOM suite's
      # expected date strings are written for it.
      TZ: Etc/GMT+5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Playwright driver (test/node_modules, no package.json committed)
        run: npm install --prefix test --no-save playwright
      - name: Install Chromium for Playwright
        run: npx playwright install chromium
      - name: Run DOM suite (DOM checks + width check + error-screen script)
        run: python3 test/dom_launcher099.py

  # The real image and both install paths, end to end — see
  # test/smoke_compose.sh. Also lints the shell scripts.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint shell scripts (shellcheck is preinstalled on ubuntu-latest)
        run: shellcheck standby/hooks/pre-start test/smoke_compose.sh
      - name: Image + compose smoke test (generic Docker and simulated Umbrel)
        run: bash test/smoke_compose.sh
