name: Build standby image

# Builds the linux/amd64 + linux/arm64 image in the cloud and pushes it
# to GHCR, so installing the app is just "click install" — no local
# Docker build.
#
# (0.8.11.1)
#   - The test suites run first (the reusable test.yml); no image is
#     built from code that fails them.
#   - Every image is tagged with the app version from
#     standby/package.json (e.g. :0.8.11.1) — the tag both compose
#     files pin — plus :sha-<commit>, plus :latest for installs that
#     still reference it.
#   - A version tag is never overwritten: if :<version> already exists
#     the build is skipped with a warning. Bump the version in
#     standby/package.json to ship a change.
#   - Third-party actions are pinned to commit SHAs (tag in the
#     comment), so a moved tag cannot change what runs with the
#     package-write token.
#   - The pushed digest is printed in the job summary, for pinning the
#     compose files as <tag>@sha256:<digest>.

on:
  push:
    branches: [main]
    paths:
      - 'standby/**'
      - '.github/workflows/build-standby-image.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: build-standby-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/thefuckisalommy/standby
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the app version
        id: version
        run: |
          v="$(node -p "require('./standby/package.json').version")"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){2,3}$'; then
            echo "::error::standby/package.json version '$v' is not a release version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version tag
        id: exists
        run: |
          out="$(docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" 2>&1)" && {
            echo "::warning::$IMAGE:${{ steps.version.outputs.version }} already exists — not rebuilding. Bump the version in standby/package.json to ship this change."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # inspect failed: distinguish "tag does not exist" (safe to build)
          # from any other failure (network, auth, registry) — the latter
          # must fail the job, not proceed to a push that could overwrite
          # an existing tag.
          if printf '%s' "$out" | grep -qiE 'not found|no such manifest|manifest unknown|MANIFEST_UNKNOWN'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not verify whether $IMAGE:${{ steps.version.outputs.version }} exists — refusing to build rather than risk overwriting a tag."
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Build and push (linux/amd64,linux/arm64)
        id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: standby
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Summary
        if: steps.exists.outputs.skip != 'true'
        run: |
          {
            echo "### Pushed $IMAGE:${{ steps.version.outputs.version }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Pin it in both compose files as:"
            echo
            echo "\`$IMAGE:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
